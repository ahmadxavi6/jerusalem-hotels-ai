<!doctype html>
<html>
  <head>
    <title>Add Hotel</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: Inter, sans-serif;
        background: #0a1628;
        color: #e2eeff;
        padding: 24px;
      }
      .card {
        max-width: 700px;
        margin: 0 auto;
        background: rgba(13, 31, 61, 0.6);
        border: 1px solid rgba(74, 144, 217, 0.2);
        border-radius: 16px;
        padding: 32px;
      }
      h1 {
        color: #4a90d9;
        font-size: 20px;
        margin-bottom: 24px;
      }
      .field {
        margin-bottom: 16px;
      }
      label {
        display: block;
        font-size: 12px;
        color: #4a90d9;
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      input,
      textarea,
      select {
        width: 100%;
        padding: 10px 14px;
        background: rgba(10, 22, 40, 0.8);
        border: 1px solid rgba(74, 144, 217, 0.2);
        border-radius: 8px;
        color: #e2eeff;
        font-size: 13px;
        outline: none;
        font-family: Inter, sans-serif;
      }
      textarea {
        height: 80px;
        resize: vertical;
      }
      input:focus,
      textarea:focus {
        border-color: #4a90d9;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .actions {
        display: flex;
        gap: 12px;
        margin-top: 24px;
      }
      .btn {
        padding: 10px 20px;
        border-radius: 8px;
        border: none;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
      }
      .btn-primary {
        background: linear-gradient(135deg, #4a90d9, #2d6aa0);
        color: white;
      }
      .btn-secondary {
        background: rgba(255, 255, 255, 0.05);
        color: #a8c4e8;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>➕ Add New Hotel</h1>
      <form method="POST">
        <div class="field">
          <label>Hotel Name</label>
          <input
            type="text"
            name="name"
            required
            placeholder="e.g. King David Hotel"
          />
        </div>
        <div class="row">
          <div class="field">
            <label>Location</label>
            <input
              type="text"
              name="location"
              required
              placeholder="e.g. 23 King David Street"
            />
          </div>
          <div class="field">
            <label>Neighborhood</label>
            <input
              type="text"
              name="neighborhood"
              required
              placeholder="e.g. City Center"
            />
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label>Stars (1-5)</label>
            <select name="stars">
              <option value="1">1 ⭐</option>
              <option value="2">2 ⭐⭐</option>
              <option value="3">3 ⭐⭐⭐</option>
              <option value="4" selected>4 ⭐⭐⭐⭐</option>
              <option value="5">5 ⭐⭐⭐⭐⭐</option>
            </select>
          </div>
          <div class="field">
            <label>Price Range (NIS per night)</label>
            <div style="display: flex; gap: 8px">
              <input
                type="number"
                name="price_min"
                placeholder="Min"
                required
              />
              <input
                type="number"
                name="price_max"
                placeholder="Max"
                required
              />
            </div>
          </div>
        </div>
        <div class="field">
          <label>Amenities</label>
          <input
            type="text"
            name="amenities"
            placeholder="e.g. Pool, Spa, Free WiFi, Gym"
          />
        </div>
        <div class="field">
          <label>Nearby Attractions</label>
          <input
            type="text"
            name="nearby"
            placeholder="e.g. Old City 10 min walk"
          />
        </div>
        <div class="field">
          <label>Description</label>
          <textarea
            name="description"
            placeholder="Describe the hotel..."
          ></textarea>
        </div>
        <div class="actions">
          <button type="submit" class="btn btn-primary">Add Hotel</button>
          <a href="/admin" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </body>
</html>
