<!doctype html>
<html>
  <head>
    <title>Edit Hotel</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: Inter, sans-serif;
        background: #0a1628;
        color: #e2eeff;
        padding: 24px;
      }
      .card {
        max-width: 700px;
        margin: 0 auto;
        background: rgba(13, 31, 61, 0.6);
        border: 1px solid rgba(74, 144, 217, 0.2);
        border-radius: 16px;
        padding: 32px;
      }
      h1 {
        color: #4a90d9;
        font-size: 20px;
        margin-bottom: 24px;
      }
      .field {
        margin-bottom: 16px;
      }
      label {
        display: block;
        font-size: 12px;
        color: #4a90d9;
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      input,
      textarea,
      select {
        width: 100%;
        padding: 10px 14px;
        background: rgba(10, 22, 40, 0.8);
        border: 1px solid rgba(74, 144, 217, 0.2);
        border-radius: 8px;
        color: #e2eeff;
        font-size: 13px;
        outline: none;
        font-family: Inter, sans-serif;
      }
      textarea {
        height: 80px;
        resize: vertical;
      }
      input:focus,
      textarea:focus {
        border-color: #4a90d9;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .actions {
        display: flex;
        gap: 12px;
        margin-top: 24px;
      }
      .btn {
        padding: 10px 20px;
        border-radius: 8px;
        border: none;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
      }
      .btn-primary {
        background: linear-gradient(135deg, #4a90d9, #2d6aa0);
        color: white;
      }
      .btn-secondary {
        background: rgba(255, 255, 255, 0.05);
        color: #a8c4e8;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>✏️ Edit Hotel</h1>
      <form method="POST">
        <div class="field">
          <label>Hotel Name</label>
          <input type="text" name="name" value="{{ hotel.name }}" required />
        </div>
        <div class="row">
          <div class="field">
            <label>Location</label>
            <input
              type="text"
              name="location"
              value="{{ hotel.location }}"
              required
            />
          </div>
          <div class="field">
            <label>Neighborhood</label>
            <input
              type="text"
              name="neighborhood"
              value="{{ hotel.neighborhood }}"
              required
            />
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label>Stars (1-5)</label>
            <select name="stars">
             {% for i in range(1, 6) %}
                <option value="{{ i }}" {% if hotel.stars == i %}selected{% endif %}>{{ i }} ⭐</option>
              {% endfor %}
            </select>
          </div>
          <div class="field">
            <label>Price Range (NIS per night)</label>
            <div style="display: flex; gap: 8px">
              <input
                type="number"
                name="price_min"
                value="{{ hotel.price_min }}"
                required
              />
              <input
                type="number"
                name="price_max"
                value="{{ hotel.price_max }}"
                required
              />
            </div>
          </div>
        </div>
        <div class="field">
          <label>Amenities</label>
          <input type="text" name="amenities" value="{{ hotel.amenities }}" />
        </div>
        <div class="field">
          <label>Nearby Attractions</label>
          <input type="text" name="nearby" value="{{ hotel.nearby }}" />
        </div>
        <div class="field">
          <label>Description</label>
          <textarea name="description">{{ hotel.description }}</textarea>
        </div>
        <div class="actions">
          <button type="submit" class="btn btn-primary">Save Changes</button>
          <a href="/admin" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </body>
</html>
