<!doctype html>
<html>
  <head>
    <title>Admin Login</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: Inter, sans-serif;
        background: #0a1628;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .card {
        background: rgba(13, 31, 61, 0.8);
        border: 1px solid rgba(74, 144, 217, 0.3);
        border-radius: 16px;
        padding: 40px;
        width: 360px;
      }
      h1 {
        color: #4a90d9;
        font-size: 22px;
        margin-bottom: 24px;
        text-align: center;
      }
      input {
        width: 100%;
        padding: 12px 16px;
        background: rgba(10, 22, 40, 0.8);
        border: 1px solid rgba(74, 144, 217, 0.3);
        border-radius: 8px;
        color: #e2eeff;
        font-size: 14px;
        outline: none;
        margin-bottom: 12px;
      }
      button {
        width: 100%;
        background: linear-gradient(135deg, #4a90d9, #2d6aa0);
        color: white;
        border: none;
        padding: 12px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .error {
        color: #ff6b6b;
        font-size: 13px;
        margin-bottom: 12px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>🏨 Admin Panel</h1>
      {% if error %}
      <p class="error">{{ error }}</p>
      {% endif %}
      <form method="POST">
        <input
          type="password"
          name="password"
          placeholder="Admin password"
          required
        />
        <button type="submit">Login</button>
      </form>
    </div>
  </body>
</html>
